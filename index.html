<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Portfolio Tracker - Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=options-portfolio-tracker.html">
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .link {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Options Portfolio Tracker</h1>
        <div class="loader"></div>
        <p>Redirecting to portfolio tracker...</p>
        <p><small>If you are not redirected automatically, <a href="options-portfolio-tracker.html" class="link">click here</a></small></p>
    </div>
    
    <script>
        // Redirect after a short delay
        setTimeout(() => {
            window.location.href = 'options-portfolio-tracker.html';
        }, 1500);
    </script>
</body>
</html>
