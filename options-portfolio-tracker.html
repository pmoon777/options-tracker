<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Portfolio Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Parse option symbol utility
        const parseOptionSymbol = (symbol) => {
            const cleaned = symbol.replace(/^\./, '');
            const match = cleaned.match(/^([A-Z]+)(\d{6})([CP])(\d+(?:\.\d+)?)$/);
            
            if (!match) return null;
            
            const [, underlying, dateStr, optionType, strike] = match;
            
            // Parse date: YYMMDD format
            const year = 2000 + parseInt(dateStr.substring(0, 2));
            const month = parseInt(dateStr.substring(2, 4)) - 1; // JS months are 0-indexed
            const day = parseInt(dateStr.substring(4, 6));
            const expirationDate = new Date(year, month, day);
            
            return {
                underlying,
                expirationDate: expirationDate.toLocaleDateString(),
                type: optionType.toLowerCase() === 'c' ? 'call' : 'put',
                strike: parseFloat(strike)
            };
        };

        // Configuration for API credentials
        const API_CONFIG = {
            clientId: '',
            redirectUri: 'https://pmoon777.github.io/options-tracker/options-portfolio-tracker.html',
            // Correct Schwab API endpoints
            authUrl: 'https://api.schwabapi.com/v1/oauth/authorize',
            tokenUrl: 'https://api.schwabapi.com/v1/oauth/token',
            marketDataUrl: 'https://api.schwabapi.com/marketdata/v1',
            accessToken: null,
            refreshToken: null
        };

        // Schwab API Service (replaces mock service)
        const schwabApiService = {
            // Check if API is configured
            isConfigured: () => {
                return API_CONFIG.clientId && API_CONFIG.accessToken;
            },

            // Get authentication URL for OAuth
            getAuthUrl: () => {
                if (!API_CONFIG.clientId) {
                    throw new Error('Client ID is required');
                }
                
                const params = new URLSearchParams({
                    response_type: 'code',
                    client_id: API_CONFIG.clientId,
                    redirect_uri: API_CONFIG.redirectUri,
                    scope: 'readonly'
                });
                return `${API_CONFIG.authUrl}?${params}`;
            },

            // Exchange authorization code for access token
            exchangeCodeForToken: async (code) => {
                if (!API_CONFIG.clientId) {
                    throw new Error('Client ID is required');
                }

                console.log('Exchanging auth code for token...', {
                    clientId: API_CONFIG.clientId,
                    redirectUri: API_CONFIG.redirectUri,
                    code: code.substring(0, 10) + '...'
                });

                try {
                    const response = await fetch(API_CONFIG.tokenUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'application/json'
                        },
                        body: new URLSearchParams({
                            grant_type: 'authorization_code',
                            code: code,
                            redirect_uri: API_CONFIG.redirectUri,
                            client_id: API_CONFIG.clientId
                        })
                    });

                    const responseText = await response.text();
                    console.log('Token exchange response:', response.status, responseText);

                    if (!response.ok) {
                        let errorMessage = `HTTP ${response.status}`;
                        try {
                            const errorData = JSON.parse(responseText);
                            errorMessage = errorData.error_description || errorData.error || errorMessage;
                        } catch (e) {
                            errorMessage = responseText || errorMessage;
                        }
                        throw new Error(`Authentication failed: ${errorMessage}`);
                    }

                    const data = JSON.parse(responseText);
                    API_CONFIG.accessToken = data.access_token;
                    API_CONFIG.refreshToken = data.refresh_token;
                    
                    // Store in localStorage for persistence
                    localStorage.setItem('schwab_access_token', data.access_token);
                    localStorage.setItem('schwab_refresh_token', data.refresh_token);
                    
                    return data;
                } catch (error) {
                    console.error('Token exchange failed:', error);
                    throw error;
                }
            },

            // Get option price from Schwab API
            getOptionPrice: async (symbol) => {
                // If not configured, fall back to mock data
                if (!schwabApiService.isConfigured()) {
                    return mockSchwabService.getOptionPrice(symbol);
                }

                console.log(`Fetching real price for: ${symbol}`);
                
                try {
                    const response = await fetch(
                        `${API_CONFIG.marketDataUrl}/pricehistory?symbol=${encodeURIComponent(symbol)}`, 
                        {
                            headers: {
                                'Authorization': `Bearer ${API_CONFIG.accessToken}`,
                                'Accept': 'application/json'
                            }
                        }
                    );

                    if (!response.ok) {
                        if (response.status === 401) {
                            // Token expired, try to refresh
                            await schwabApiService.refreshAccessToken();
                            // Retry the request
                            return schwabApiService.getOptionPrice(symbol);
                        }
                        throw new Error(`API request failed: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    // Parse option symbol
                    const parsed = parseOptionSymbol(symbol);
                    if (!parsed) {
                        throw new Error('Invalid option symbol format');
                    }

                    // Extract price data (adjust based on actual Schwab API response format)
                    const currentPrice = data.candles?.[0]?.close || 2.50;
                    
                    return {
                        symbol: symbol,
                        description: `${parsed.underlying} ${parsed.expirationDate} $${parsed.strike} ${parsed.type.toUpperCase()}`,
                        currentPrice: parseFloat(currentPrice.toFixed(2)),
                        bid: currentPrice - 0.05,
                        ask: currentPrice + 0.05,
                        volume: data.candles?.[0]?.volume || 0,
                        openInterest: 0, // Would need separate API call
                        daysToExpiration: Math.ceil((new Date(parsed.expirationDate) - new Date()) / (1000 * 60 * 60 * 24)),
                        delta: 0, // Would need options chain API
                        gamma: 0,
                        theta: 0,
                        vega: 0,
                        impliedVolatility: 0,
                        lastUpdated: new Date().toLocaleTimeString()
                    };
                } catch (error) {
                    console.error('Schwab API error:', error);
                    // Fall back to mock data on error
                    return mockSchwabService.getOptionPrice(symbol);
                }
            },

            // Refresh access token
            refreshAccessToken: async () => {
                if (!API_CONFIG.refreshToken) {
                    throw new Error('No refresh token available');
                }

                try {
                    const response = await fetch(API_CONFIG.tokenUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'application/json'
                        },
                        body: new URLSearchParams({
                            grant_type: 'refresh_token',
                            refresh_token: API_CONFIG.refreshToken,
                            client_id: API_CONFIG.clientId
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to refresh token');
                    }

                    const data = await response.json();
                    API_CONFIG.accessToken = data.access_token;
                    localStorage.setItem('schwab_access_token', data.access_token);
                    
                    return data;
                } catch (error) {
                    console.error('Token refresh failed:', error);
                    // Clear stored tokens
                    API_CONFIG.accessToken = null;
                    API_CONFIG.refreshToken = null;
                    localStorage.removeItem('schwab_access_token');
                    localStorage.removeItem('schwab_refresh_token');
                    throw error;
                }
            }
        };

        // Mock service for fallback/demo (kept for when API is not configured)
        const mockSchwabService = {
            getOptionPrice: async (symbol) => {
                console.log(`Fetching mock price for: ${symbol}`);
                
                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Parse option symbol
                const parsed = parseOptionSymbol(symbol);
                if (!parsed) {
                    throw new Error('Invalid option symbol format');
                }
                
                // Generate realistic current price with some variation
                const basePrice = 2.50;
                const variation = (Math.random() - 0.5) * 2.0; // +/- $1.00 variation (increased for more noticeable trends)
                const currentPrice = Math.max(0.05, basePrice + variation);
                
                return {
                    symbol: symbol,
                    description: `${parsed.underlying} ${parsed.expirationDate} $${parsed.strike} ${parsed.type.toUpperCase()}`,
                    currentPrice: parseFloat(currentPrice.toFixed(2)),
                    bid: currentPrice - 0.05,
                    ask: currentPrice + 0.05,
                    volume: Math.floor(Math.random() * 1000) + 100,
                    openInterest: Math.floor(Math.random() * 5000) + 500,
                    daysToExpiration: Math.ceil((new Date(parsed.expirationDate) - new Date()) / (1000 * 60 * 60 * 24)),
                    delta: parsed.type === 'call' ? (0.3 + Math.random() * 0.4) : -(0.3 + Math.random() * 0.4),
                    gamma: 0.02 + Math.random() * 0.08,
                    theta: -(0.05 + Math.random() * 0.15),
                    vega: 0.1 + Math.random() * 0.3,
                    impliedVolatility: 0.20 + Math.random() * 0.20,
                    lastUpdated: new Date().toLocaleTimeString()
                };
            }
        };

        // API Configuration Component
        const ApiConfigSection = ({ onConfigured }) => {
            const [clientId, setClientId] = React.useState(API_CONFIG.clientId);
            const [isAuthenticating, setIsAuthenticating] = React.useState(false);
            const [authError, setAuthError] = React.useState(null);
            const [showDebugInfo, setShowDebugInfo] = React.useState(false);

            const handleSaveConfig = () => {
                if (!clientId.trim()) {
                    alert('Please enter your Schwab Client ID');
                    return;
                }
                API_CONFIG.clientId = clientId.trim();
                localStorage.setItem('schwab_client_id', clientId.trim());
                setAuthError(null);
                onConfigured();
            };

            const handleAuthenticate = () => {
                if (!clientId.trim()) {
                    alert('Please save your Client ID first');
                    return;
                }
                
                setIsAuthenticating(true);
                setAuthError(null);
                
                try {
                    API_CONFIG.clientId = clientId.trim();
                    localStorage.setItem('schwab_client_id', clientId.trim());
                    
                    const authUrl = schwabApiService.getAuthUrl();
                    console.log('Redirecting to auth URL:', authUrl);
                    window.location.href = authUrl;
                } catch (error) {
                    setIsAuthenticating(false);
                    setAuthError(error.message);
                }
            };

            return React.createElement('div', {
                className: 'bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-lg p-6 mb-6'
            }, [
                React.createElement('h3', {
                    key: 'title',
                    className: 'text-lg font-bold text-blue-800 mb-4 flex items-center'
                }, [
                    React.createElement('span', { key: 'icon', className: 'mr-2' }, '🔐'),
                    'Configure Schwab API'
                ]),

                React.createElement('div', {
                    key: 'description',
                    className: 'text-sm text-blue-700 mb-4'
                }, [
                    React.createElement('p', { key: 'p1' }, '⚠️ If you get "invalid client" error, follow these exact steps:'),
                    React.createElement('ol', {
                        key: 'steps',
                        className: 'list-decimal ml-5 mt-2 space-y-2'
                    }, [
                        React.createElement('li', { key: 'step1' }, [
                            React.createElement('strong', { key: 'bold' }, 'Go to '),
                            React.createElement('a', {
                                key: 'link',
                                href: 'https://developer.schwab.com/',
                                target: '_blank',
                                className: 'text-blue-600 underline'
                            }, 'Schwab Developer Portal'),
                            React.createElement('span', { key: 'text' }, ' and register/login')
                        ]),
                        React.createElement('li', { key: 'step2' }, [
                            React.createElement('strong', { key: 'bold' }, 'Create new app with EXACT redirect URI: '),
                            React.createElement('code', {
                                key: 'uri',
                                className: 'bg-gray-100 px-2 py-1 rounded text-xs'
                            }, 'https://pmoon777.github.io/options-tracker/options-portfolio-tracker.html')
                        ]),
                        React.createElement('li', { key: 'step3' }, 'Copy the exact Client ID from your app settings'),
                        React.createElement('li', { key: 'step4' }, 'Paste Client ID below and click Save Config'),
                        React.createElement('li', { key: 'step5' }, 'Wait for app approval (can take 24-48 hours)')
                    ])
                ]),

                React.createElement('div', {
                    key: 'form',
                    className: 'grid grid-cols-1 md:grid-cols-3 gap-3 mb-4'
                }, [
                    React.createElement('input', {
                        key: 'client-id',
                        type: 'text',
                        value: clientId,
                        onChange: (e) => setClientId(e.target.value),
                        placeholder: 'Enter Schwab Client ID (format: 12345678-1234-...)',
                        className: 'px-3 py-2 border border-blue-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white'
                    }),
                    React.createElement('button', {
                        key: 'save',
                        onClick: handleSaveConfig,
                        className: 'px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500'
                    }, 'Save Config'),
                    React.createElement('button', {
                        key: 'auth',
                        onClick: handleAuthenticate,
                        disabled: !clientId.trim(),
                        className: 'px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 disabled:opacity-50 disabled:cursor-not-allowed'
                    }, isAuthenticating ? 'Redirecting...' : '🔗 Authenticate with Schwab')
                ]),

                React.createElement('div', {
                    key: 'debug-toggle',
                    className: 'mb-4'
                }, React.createElement('button', {
                    onClick: () => setShowDebugInfo(!showDebugInfo),
                    className: 'text-xs text-gray-600 hover:text-gray-800 underline'
                }, showDebugInfo ? 'Hide Debug Info' : 'Show Debug Info')),

                showDebugInfo && React.createElement('div', {
                    key: 'debug-info',
                    className: 'mt-2 mb-4 p-3 bg-gray-100 border rounded text-xs'
                }, [
                    React.createElement('p', { key: 'debug-title', className: 'font-bold' }, 'Debug Information:'),
                    React.createElement('p', { key: 'client-id' }, `Client ID: ${API_CONFIG.clientId || 'Not set'}`),
                    React.createElement('p', { key: 'redirect' }, `Redirect URI: ${API_CONFIG.redirectUri}`),
                    React.createElement('p', { key: 'auth-url' }, `Auth URL: ${API_CONFIG.authUrl}`),
                    React.createElement('p', { key: 'token-url' }, `Token URL: ${API_CONFIG.tokenUrl}`),
                    React.createElement('p', { key: 'has-token' }, `Has Access Token: ${API_CONFIG.accessToken ? 'Yes' : 'No'}`)
                ]),

                API_CONFIG.accessToken && React.createElement('div', {
                    key: 'success',
                    className: 'mt-4 p-3 bg-green-100 border border-green-300 rounded text-green-700 text-sm'
                }, '✅ Connected to Schwab API - Real option data is now available!'),

                authError && React.createElement('div', {
                    key: 'error',
                    className: 'mt-4 p-3 bg-red-100 border border-red-300 rounded text-red-700 text-sm'
                }, [
                    React.createElement('strong', { key: 'title' }, '❌ Authentication Error: '),
                    React.createElement('span', { key: 'message' }, authError),
                    React.createElement('br', { key: 'br' }),
                    React.createElement('br', { key: 'br2' }),
                    React.createElement('span', { key: 'help', className: 'text-xs' }, 
                        'Common fixes: 1) Check Client ID format, 2) Verify redirect URI exactly matches, 3) Wait for app approval, 4) Try again in 5 minutes'
                    )
                ]),

                !API_CONFIG.accessToken && React.createElement('div', {
                    key: 'demo-mode',
                    className: 'mt-4 p-3 bg-yellow-100 border border-yellow-300 rounded text-yellow-800 text-sm'
                }, '🎭 Demo Mode: Using mock data for demonstration. Configure API above for real option prices.')
            ]);
        };

        // Option Search Component for Adding to Watchlist
        const OptionsSearch = ({ onAddOption, loading }) => {
            const [symbol, setSymbol] = React.useState('');
            const [entryPrice, setEntryPrice] = React.useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (symbol.trim() && entryPrice.trim()) {
                    const entry = parseFloat(entryPrice);
                    if (isNaN(entry) || entry <= 0) {
                        alert('Please enter a valid entry price');
                        return;
                    }
                    await onAddOption(symbol.trim().toUpperCase(), entry);
                    setSymbol('');
                    setEntryPrice('');
                }
            };

            return React.createElement('form', {
                onSubmit: handleSubmit,
                className: 'bg-white p-6 rounded-lg shadow-md space-y-4'
            }, [
                React.createElement('h3', {
                    key: 'title',
                    className: 'text-lg font-bold text-gray-800'
                }, '📊 Add Option to Track'),
                
                React.createElement('div', {
                    key: 'input-group',
                    className: 'grid grid-cols-1 md:grid-cols-3 gap-3'
                }, [
                    React.createElement('input', {
                        key: 'symbol-input',
                        type: 'text',
                        value: symbol,
                        onChange: (e) => setSymbol(e.target.value),
                        placeholder: '.CCL260515C28',
                        className: 'px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500',
                        disabled: loading
                    }),
                    React.createElement('input', {
                        key: 'price-input',
                        type: 'number',
                        step: '0.01',
                        min: '0.01',
                        value: entryPrice,
                        onChange: (e) => setEntryPrice(e.target.value),
                        placeholder: 'Entry Price ($)',
                        className: 'px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500',
                        disabled: loading
                    }),
                    React.createElement('button', {
                        key: 'submit',
                        type: 'submit',
                        disabled: loading || !symbol.trim() || !entryPrice.trim(),
                        className: 'px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed',
                    }, loading ? 'Adding...' : '+ Add to Watch')
                ]),
                
                React.createElement('div', {
                    key: 'examples',
                    className: 'flex flex-wrap gap-2'
                }, [
                    React.createElement('div', {
                        key: 'examples-label',
                        className: 'text-sm text-gray-600 w-full'
                    }, 'Quick Examples:'),
                    React.createElement('button', {
                        key: 'ccl-example',
                        type: 'button',
                        onClick: () => { setSymbol('.CCL260515C28'); setEntryPrice('2.85'); },
                        className: 'px-2 py-1 text-xs bg-green-100 hover:bg-green-200 text-green-700 rounded border'
                    }, '.CCL260515C28 @ $2.85'),
                    React.createElement('button', {
                        key: 'aapl-example',
                        type: 'button',
                        onClick: () => { setSymbol('.AAPL260515P200'); setEntryPrice('4.50'); },
                        className: 'px-2 py-1 text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 rounded border'
                    }, '.AAPL260515P200 @ $4.50'),
                    React.createElement('button', {
                        key: 'tsla-example',
                        type: 'button',
                        onClick: () => { setSymbol('.TSLA260612C300'); setEntryPrice('8.25'); },
                        className: 'px-2 py-1 text-xs bg-purple-100 hover:bg-purple-200 text-purple-700 rounded border'
                    }, '.TSLA260612C300 @ $8.25')
                ]),
                
                React.createElement('div', {
                    key: 'format-help',
                    className: 'text-xs text-gray-500 bg-gray-50 p-2 rounded'
                }, [
                    React.createElement('strong', { key: 'label' }, 'Format: '),
                    '.SYMBOL + YYMMDD + C/P + STRIKE (e.g., .CCL260515C28 = CCL May 15, 2026 $28 Call)'
                ])
            ]);
        };

        // Option Table Row Component
        const OptionTableRow = ({ option, onRemove, onUpdateEntry }) => {
            const [isEditingEntry, setIsEditingEntry] = React.useState(false);
            const [editEntryValue, setEditEntryValue] = React.useState(option.entryPrice.toString());
            
            const gainLoss = option.currentPrice - option.entryPrice;
            const gainLossPercent = ((gainLoss / option.entryPrice) * 100);
            const isProfit = gainLoss >= 0;
            
            const handleEntryEdit = () => {
                setIsEditingEntry(true);
                setEditEntryValue(option.entryPrice.toString());
            };
            
            const handleEntrySave = () => {
                const newPrice = parseFloat(editEntryValue);
                if (!isNaN(newPrice) && newPrice > 0) {
                    onUpdateEntry(option.symbol, newPrice);
                }
                setIsEditingEntry(false);
            };
            
            const handleEntryCancel = () => {
                setIsEditingEntry(false);
                setEditEntryValue(option.entryPrice.toString());
            };
            
            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    handleEntrySave();
                } else if (e.key === 'Escape') {
                    handleEntryCancel();
                }
            };
            
            return React.createElement('tr', {
                className: 'hover:bg-gray-50 border-b border-gray-200'
            }, [
                // Symbol
                React.createElement('td', {
                    key: 'symbol',
                    className: 'px-4 py-3 font-medium text-gray-900'
                }, [
                    React.createElement('div', { key: 'symbol' }, option.symbol),
                    React.createElement('div', {
                        key: 'description',
                        className: 'text-xs text-gray-500'
                    }, option.description || 'Option Contract')
                ]),
                
                // Entry Price (Editable)
                React.createElement('td', {
                    key: 'entry',
                    className: 'px-4 py-3 text-center'
                }, isEditingEntry 
                    ? React.createElement('div', {
                        className: 'flex items-center justify-center space-x-1'
                    }, [
                        React.createElement('input', {
                            key: 'input',
                            type: 'number',
                            step: '0.01',
                            value: editEntryValue,
                            onChange: (e) => setEditEntryValue(e.target.value),
                            onKeyDown: handleKeyPress,
                            className: 'w-20 px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500',
                            autoFocus: true
                        }),
                        React.createElement('button', {
                            key: 'save',
                            onClick: handleEntrySave,
                            className: 'text-green-600 hover:text-green-800 text-xs'
                        }, '✓'),
                        React.createElement('button', {
                            key: 'cancel',
                            onClick: handleEntryCancel,
                            className: 'text-red-600 hover:text-red-800 text-xs'
                        }, '×')
                    ])
                    : React.createElement('div', {
                        className: 'font-semibold text-blue-700 cursor-pointer hover:bg-blue-50 px-2 py-1 rounded',
                        onClick: handleEntryEdit,
                        title: 'Click to edit entry price'
                    }, `$${option.entryPrice.toFixed(2)}`)
                ),
                
                // Current Price
                React.createElement('td', {
                    key: 'current',
                    className: 'px-4 py-3 text-center font-semibold'
                }, `$${option.currentPrice.toFixed(2)}`),
                
                // Trend Arrow
                React.createElement('td', {
                    key: 'trend',
                    className: 'px-4 py-3 text-center'
                }, React.createElement('div', {
                    className: `inline-flex items-center justify-center w-6 h-6 rounded text-white text-sm font-bold ${
                        option.trend === 'up' ? 'bg-green-500' : 
                        option.trend === 'down' ? 'bg-red-500' : 
                        'bg-gray-400'
                    }`,
                    title: option.trend === 'up' ? 'Price trending up' : 
                           option.trend === 'down' ? 'Price trending down' : 
                           'No price change'
                }, option.trend === 'up' ? '↑' : 
                   option.trend === 'down' ? '↓' : 
                   '•')),
                
                // Gain/Loss $
                React.createElement('td', {
                    key: 'gainloss-dollar',
                    className: `px-4 py-3 text-center font-semibold ${
                        isProfit ? 'text-green-700' : 'text-red-700'
                    }`
                }, `${isProfit ? '+' : ''}$${gainLoss.toFixed(2)}`),
                
                // Gain/Loss %
                React.createElement('td', {
                    key: 'gainloss-percent',
                    className: `px-4 py-3 text-center font-bold ${
                        isProfit ? 'text-green-700' : 'text-red-700'
                    }`
                }, `${isProfit ? '+' : ''}${gainLossPercent.toFixed(1)}%`),
                
                // Days to Exp
                React.createElement('td', {
                    key: 'days',
                    className: 'px-4 py-3 text-center text-sm text-gray-600'
                }, option.daysToExpiration || 'N/A'),
                
                // Volume
                React.createElement('td', {
                    key: 'volume',
                    className: 'px-4 py-3 text-center text-sm text-gray-600'
                }, (option.volume || 0).toLocaleString()),
                
                // Delta
                React.createElement('td', {
                    key: 'delta',
                    className: 'px-4 py-3 text-center text-sm text-gray-600'
                }, option.delta ? option.delta.toFixed(3) : 'N/A'),
                
                // IV
                React.createElement('td', {
                    key: 'iv',
                    className: 'px-4 py-3 text-center text-sm text-gray-600'
                }, option.impliedVolatility ? `${(option.impliedVolatility * 100).toFixed(1)}%` : 'N/A'),
                
                // Actions
                React.createElement('td', {
                    key: 'actions',
                    className: 'px-4 py-3 text-center'
                }, React.createElement('button', {
                    onClick: () => onRemove(option.symbol),
                    className: 'text-red-500 hover:text-red-700 font-bold text-lg'
                }, '×'))
            ]);
        };

        // Main Portfolio Tracker App
        const PortfolioApp = () => {
            const [watchlist, setWatchlist] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [lastAutoRefresh, setLastAutoRefresh] = React.useState(new Date());
            const [sortConfig, setSortConfig] = React.useState({ key: null, direction: 'desc' });
            const [showApiConfig, setShowApiConfig] = React.useState(false);

            // Initialize API config and handle OAuth callback
            React.useEffect(() => {
                // Load saved config from localStorage
                const savedClientId = localStorage.getItem('schwab_client_id');
                const savedAccessToken = localStorage.getItem('schwab_access_token');
                const savedRefreshToken = localStorage.getItem('schwab_refresh_token');
                
                if (savedClientId) {
                    API_CONFIG.clientId = savedClientId;
                }
                if (savedAccessToken) {
                    API_CONFIG.accessToken = savedAccessToken;
                }
                if (savedRefreshToken) {
                    API_CONFIG.refreshToken = savedRefreshToken;
                }

                // Check for OAuth callback code in URL
                const urlParams = new URLSearchParams(window.location.search);
                const authCode = urlParams.get('code');
                
                if (authCode && API_CONFIG.clientId) {
                    // Exchange auth code for access token
                    schwabApiService.exchangeCodeForToken(authCode)
                        .then(() => {
                            console.log('Successfully authenticated with Schwab API');
                            // Clean up URL
                            window.history.replaceState({}, document.title, window.location.pathname);
                        })
                        .catch(err => {
                            console.error('Failed to authenticate:', err);
                            setError('Failed to authenticate with Schwab API: ' + err.message);
                        });
                }

                // Show API config if not configured
                setShowApiConfig(!schwabApiService.isConfigured());
            }, []);

            const addOptionToWatchlist = async (symbol, entryPrice) => {
                setLoading(true);
                setError(null);
                
                try {
                    // Check if already in watchlist
                    if (watchlist.find(option => option.symbol === symbol)) {
                        alert('Option already in watchlist!');
                        return;
                    }
                    
                    // Get current price using the appropriate service
                    const optionData = await schwabApiService.getOptionPrice(symbol);
                    
                    const newOption = {
                        symbol: symbol,
                        entryPrice: entryPrice,
                        currentPrice: optionData.currentPrice,
                        previousPrice: optionData.currentPrice, // Initialize previous price
                        trend: 'neutral', // neutral, up, down
                        description: optionData.description,
                        daysToExpiration: optionData.daysToExpiration,
                        volume: optionData.volume,
                        delta: optionData.delta,
                        impliedVolatility: optionData.impliedVolatility,
                        addedAt: new Date()
                    };
                    
                    setWatchlist(prev => [...prev, newOption]);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };
            
            const removeFromWatchlist = (symbol) => {
                setWatchlist(prev => prev.filter(option => option.symbol !== symbol));
            };
            
            const updateEntryPrice = (symbol, newEntryPrice) => {
                setWatchlist(prev => prev.map(option => 
                    option.symbol === symbol 
                        ? { ...option, entryPrice: newEntryPrice }
                        : option
                ));
            };
            
            const refreshOptionPrice = async (symbol) => {
                try {
                    const optionData = await schwabApiService.getOptionPrice(symbol);
                    setWatchlist(prev => prev.map(option => {
                        if (option.symbol === symbol) {
                            const newPrice = optionData.currentPrice;
                            const oldPrice = option.currentPrice;
                            let trend = 'neutral';
                            
                            if (newPrice > oldPrice) {
                                trend = 'up';
                            } else if (newPrice < oldPrice) {
                                trend = 'down';
                            }
                            
                            return {
                                ...option, 
                                previousPrice: oldPrice,
                                currentPrice: newPrice, 
                                trend: trend,
                                description: optionData.description,
                                daysToExpiration: optionData.daysToExpiration,
                                delta: optionData.delta, 
                                volume: optionData.volume
                            };
                        }
                        return option;
                    }));
                } catch (err) {
                    console.error('Failed to refresh option price:', err);
                }
            };
            
            const refreshAllPrices = async () => {
                console.log('Auto-refreshing all option prices...');
                for (const option of watchlist) {
                    await refreshOptionPrice(option.symbol);
                }
                setLastAutoRefresh(new Date());
            };
            
            // Auto refresh every 60 seconds
            React.useEffect(() => {
                if (watchlist.length === 0) return;
                
                const interval = setInterval(refreshAllPrices, 60000); // 1 minute
                
                return () => clearInterval(interval);
            }, [watchlist]);
            
            // Sorting function
            const handleSort = (key) => {
                let direction = 'desc';
                if (sortConfig.key === key && sortConfig.direction === 'desc') {
                    direction = 'asc';
                }
                setSortConfig({ key, direction });
            };
            
            // Sort watchlist based on current sort config
            const sortedWatchlist = React.useMemo(() => {
                if (!sortConfig.key) return watchlist;
                
                return [...watchlist].sort((a, b) => {
                    let aValue, bValue;
                    
                    if (sortConfig.key === 'pnlPercent') {
                        aValue = ((a.currentPrice - a.entryPrice) / a.entryPrice) * 100;
                        bValue = ((b.currentPrice - b.entryPrice) / b.entryPrice) * 100;
                    }
                    
                    if (sortConfig.direction === 'asc') {
                        return aValue < bValue ? -1 : 1;
                    } else {
                        return aValue > bValue ? -1 : 1;
                    }
                });
            }, [watchlist, sortConfig]);

            // Calculate portfolio totals
            const portfolioTotals = React.useMemo(() => {
                const totalValue = watchlist.reduce((sum, option) => sum + option.currentPrice, 0);
                const totalCost = watchlist.reduce((sum, option) => sum + option.entryPrice, 0);
                const totalGainLoss = totalValue - totalCost;
                const totalGainLossPercent = totalCost > 0 ? (totalGainLoss / totalCost) * 100 : 0;
                
                return {
                    totalValue: totalValue.toFixed(2),
                    totalCost: totalCost.toFixed(2),
                    totalGainLoss: totalGainLoss.toFixed(2),
                    totalGainLossPercent: totalGainLossPercent.toFixed(1),
                    isProfit: totalGainLoss >= 0
                };
            }, [watchlist]);

            return React.createElement('div', {
                className: 'min-h-screen bg-gray-50'
            }, [
                // Header
                React.createElement('header', {
                    key: 'header',
                    className: 'bg-white shadow-sm border-b'
                }, 
                    React.createElement('div', {
                        className: 'max-w-7xl mx-auto px-4 py-6'
                    }, [
                        React.createElement('h1', {
                            key: 'title',
                            className: 'text-3xl font-bold text-gray-900'
                        }, '📊 Options Portfolio Tracker'),
                        React.createElement('p', {
                            key: 'subtitle',
                            className: 'text-gray-600 mt-1'
                        }, 'Track your option positions with real-time P&L monitoring')
                    ])
                ),

                // Main Content
                React.createElement('main', {
                    key: 'main',
                    className: 'max-w-7xl mx-auto px-4 py-6 space-y-6'
                }, [
                    // API Configuration Section
                    React.createElement(ApiConfigSection, {
                        key: 'api-config',
                        onConfigured: () => setShowApiConfig(false)
                    }),
                    
                    // Add Option Section
                    React.createElement(OptionsSearch, {
                        key: 'search-component',
                        onAddOption: addOptionToWatchlist,
                        loading: loading
                    }),
                    
                    // Error Display
                    error && React.createElement('div', {
                        key: 'error',
                        className: 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg'
                    }, `Error: ${error}`),

                    // Portfolio Summary (only show if there are positions)
                    watchlist.length > 0 && React.createElement('div', {
                        key: 'portfolio-summary',
                        className: 'bg-white rounded-lg p-6 shadow-md border'
                    }, [
                        React.createElement('h2', {
                            key: 'summary-title',
                            className: 'text-xl font-bold text-gray-800 mb-4'
                        }, '💼 Portfolio Summary'),
                        React.createElement('div', {
                            key: 'summary-grid',
                            className: 'grid grid-cols-2 md:grid-cols-4 gap-4'
                        }, [
                            React.createElement('div', {
                                key: 'positions',
                                className: 'text-center p-3 bg-blue-50 rounded border border-blue-200'
                            }, [
                                React.createElement('div', {
                                    key: 'label',
                                    className: 'text-sm text-blue-600 uppercase tracking-wide'
                                }, 'Positions'),
                                React.createElement('div', {
                                    key: 'value',
                                    className: 'text-2xl font-bold text-blue-800'
                                }, watchlist.length)
                            ]),
                            React.createElement('div', {
                                key: 'total-cost',
                                className: 'text-center p-3 bg-gray-50 rounded border border-gray-200'
                            }, [
                                React.createElement('div', {
                                    key: 'label',
                                    className: 'text-sm text-gray-600 uppercase tracking-wide'
                                }, 'Total Cost'),
                                React.createElement('div', {
                                    key: 'value',
                                    className: 'text-2xl font-bold text-gray-800'
                                }, `$${portfolioTotals.totalCost}`)
                            ]),
                            React.createElement('div', {
                                key: 'current-value',
                                className: 'text-center p-3 bg-gray-50 rounded border border-gray-200'
                            }, [
                                React.createElement('div', {
                                    key: 'label',
                                    className: 'text-sm text-gray-600 uppercase tracking-wide'
                                }, 'Current Value'),
                                React.createElement('div', {
                                    key: 'value',
                                    className: 'text-2xl font-bold text-gray-800'
                                }, `$${portfolioTotals.totalValue}`)
                            ]),
                            React.createElement('div', {
                                key: 'total-gainloss',
                                className: `text-center p-3 rounded border ${
                                    portfolioTotals.isProfit 
                                        ? 'bg-green-50 border-green-200' 
                                        : 'bg-red-50 border-red-200'
                                }`
                            }, [
                                React.createElement('div', {
                                    key: 'label',
                                    className: `text-sm uppercase tracking-wide ${
                                        portfolioTotals.isProfit ? 'text-green-600' : 'text-red-600'
                                    }`
                                }, 'Total P&L'),
                                React.createElement('div', {
                                    key: 'percent',
                                    className: `text-xl font-bold ${
                                        portfolioTotals.isProfit ? 'text-green-800' : 'text-red-800'
                                    }`
                                }, `${portfolioTotals.isProfit ? '+' : ''}${portfolioTotals.totalGainLossPercent}%`),
                                React.createElement('div', {
                                    key: 'dollar',
                                    className: `text-sm ${
                                        portfolioTotals.isProfit ? 'text-green-700' : 'text-red-700'
                                    }`
                                }, `${portfolioTotals.isProfit ? '+' : ''}$${portfolioTotals.totalGainLoss}`)
                            ])
                        ])
                    ]),

                    // Watchlist Section
                    React.createElement('div', {
                        key: 'watchlist-section',
                        className: 'bg-white rounded-lg shadow-md border'
                    }, [
                        React.createElement('div', {
                            key: 'watchlist-header',
                            className: 'flex justify-between items-center p-6 border-b'
                        }, [
                            React.createElement('div', { key: 'header-left' }, [
                                React.createElement('h2', {
                                    key: 'title',
                                    className: 'text-xl font-bold text-gray-800'
                                }, `📈 Your Options (${watchlist.length})`),
                                watchlist.length > 0 && React.createElement('p', {
                                    key: 'auto-refresh-info',
                                    className: 'text-sm text-gray-500 mt-1'
                                }, `Auto-refresh: 1min | Last: ${lastAutoRefresh.toLocaleTimeString()}`)
                            ]),
                            watchlist.length > 0 && React.createElement('button', {
                                key: 'refresh-all',
                                onClick: refreshAllPrices,
                                className: 'px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm'
                            }, '🔄 Refresh Now')
                        ]),
                        
                        watchlist.length === 0 
                            ? React.createElement('div', {
                                key: 'empty-state',
                                className: 'text-center py-12'
                            }, [
                                React.createElement('div', {
                                    key: 'icon',
                                    className: 'text-6xl mb-4'
                                }, '📊'),
                                React.createElement('h3', {
                                    key: 'title',
                                    className: 'text-xl font-semibold text-gray-600 mb-2'
                                }, 'No Options Tracked Yet'),
                                React.createElement('p', {
                                    key: 'description',
                                    className: 'text-gray-500'
                                }, 'Add your first option above to start tracking your portfolio performance')
                            ])
                            : React.createElement('div', {
                                key: 'table-container',
                                className: 'overflow-x-auto'
                            }, React.createElement('table', {
                                className: 'w-full'
                            }, [
                                React.createElement('thead', {
                                    key: 'thead',
                                    className: 'bg-gray-50'
                                }, React.createElement('tr', { key: 'header-row' }, [
                                    React.createElement('th', {
                                        key: 'symbol',
                                        className: 'px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'Option Symbol'),
                                    React.createElement('th', {
                                        key: 'entry',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'Entry Price'),
                                    React.createElement('th', {
                                        key: 'current',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'Current Price'),
                                    React.createElement('th', {
                                        key: 'trend',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'Trend'),
                                    React.createElement('th', {
                                        key: 'gainloss-dollar',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'P&L ($)'),
                                    React.createElement('th', {
                                        key: 'gainloss-percent',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 select-none',
                                        onClick: () => handleSort('pnlPercent')
                                    }, [
                                        React.createElement('div', {
                                            key: 'header-content',
                                            className: 'flex items-center justify-center space-x-1'
                                        }, [
                                            React.createElement('span', { key: 'text' }, 'P&L (%)'),
                                            React.createElement('span', {
                                                key: 'sort-icon',
                                                className: 'text-gray-400'
                                            }, sortConfig.key === 'pnlPercent' 
                                                ? (sortConfig.direction === 'desc' ? '↓' : '↑')
                                                : '↕')
                                        ])
                                    ]),
                                    React.createElement('th', {
                                        key: 'days',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'Days'),
                                    React.createElement('th', {
                                        key: 'volume',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'Volume'),
                                    React.createElement('th', {
                                        key: 'delta',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'Delta'),
                                    React.createElement('th', {
                                        key: 'iv',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'IV'),
                                    React.createElement('th', {
                                        key: 'actions',
                                        className: 'px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider'
                                    }, 'Remove')
                                ])),
                                React.createElement('tbody', {
                                    key: 'tbody',
                                    className: 'bg-white divide-y divide-gray-200'
                                }, sortedWatchlist.map((option, index) => 
                                    React.createElement(OptionTableRow, {
                                        key: option.symbol,
                                        option: option,
                                        onRemove: removeFromWatchlist,
                                        onUpdateEntry: updateEntryPrice
                                    })
                                ))
                            ]))
                    ])
                ]),

                // Footer
                React.createElement('footer', {
                    key: 'footer',
                    className: 'bg-white border-t mt-12'
                }, 
                    React.createElement('div', {
                        className: 'max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-600'
                    }, schwabApiService.isConfigured() 
                        ? '🟢 Connected to Schwab API - Using real option data'
                        : '⚠️ Demo mode using mock data. Configure Schwab API above for live trading data.'
                    )
                )
            ]);
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(PortfolioApp));
    </script>
</body>
</html>
